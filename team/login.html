<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Franchise Owner Portal — Sunstone Premier League 2026</title>
    <meta name="description" content="Franchise owner sign-in and registration for Sunstone Premier League 2026 Box Cricket Tournament.">
    <!-- Favicon & Stylesheet -->
    <link rel="icon" type="image/png" href="../assets/branding/sunstone-premier-league-2026.png">
    <link href="../dist/output.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #050816;
            color: #F8FAFC;
        }

        /* Select Options in Midnight */
        select option {
            background: #08111F;
            color: #F8FAFC;
        }
    </style>
    <!-- Instant Redirect if Already Logged In -->
    <script>
        if (localStorage.getItem('unibox_team_owner_session')) {
            window.location.replace('index.html');
        }
    </script>
</head>

<body class="bg-[#050816] text-slate-100 min-h-screen flex items-center justify-center p-4 relative antialiased overflow-x-hidden">

    <!-- Subtle Background Watermark (Requirement 9) -->
    <img src="../assets/branding/sunstone-premier-league-2026.png" 
         alt="" 
         aria-hidden="true" 
         class="tournament-watermark">

    <!-- ===== CINEMATIC STADIUM ATMOSPHERE BACKGROUND ===== -->
    <div class="fixed inset-0 pointer-events-none -z-10 stadium-atmosphere">
        <!-- Franchise Gold & Royal Blue Atmospheric Glow -->
        <div class="absolute -top-40 left-1/2 -translate-x-1/2 w-[700px] h-[700px] bg-blue-600/[0.12] rounded-full blur-[160px]"></div>
        <div class="absolute bottom-0 right-10 w-[550px] h-[550px] bg-amber-500/[0.08] rounded-full blur-[160px]"></div>
        <div class="absolute top-1/3 left-0 w-[450px] h-[450px] bg-sky-500/[0.06] rounded-full blur-[140px]"></div>
        <!-- Stadium light beams -->
        <div class="stadium-beam beam-left hidden md:block"></div>
        <div class="stadium-beam beam-right hidden md:block"></div>
        <!-- Pitch lines & Grid -->
        <div class="pitch-crease-geometry opacity-35"></div>
        <div class="absolute inset-0 pitch-grid opacity-25"></div>
    </div>

    <!-- ===== MAIN CARD WRAPPER ===== -->
    <div class="relative z-10 w-full max-w-lg">

        <!-- Prominent Tournament Branding Above Login Card (Requirement 3) -->
        <div class="text-center mb-6 flex flex-col items-center">
            <img src="../assets/branding/sunstone-premier-league-2026.png"
                 alt="Sunstone Premier League 2026 Official Logo"
                 class="h-24 sm:h-28 w-auto object-contain logo-entrance tournament-logo-glow mb-3">
            <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-[#08111F]/90 border border-amber-400/25 text-[10px] font-black uppercase tracking-[0.18em] text-amber-400 backdrop-blur-md shadow-lg shadow-amber-400/5">
                <span class="text-amber-400">👑</span>
                Franchise Owner HQ
                <span class="w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse"></span>
            </div>
        </div>

        <!-- ===== LOGIN CARD ===== -->
        <div class="login-card relative overflow-hidden border border-sky-900/60 shadow-2xl rounded-3xl bg-[#08111F]/90 backdrop-blur-2xl">
            <!-- Card top accent -->
            <div class="absolute top-0 left-0 right-0 h-[2px] bg-gradient-to-r from-transparent via-amber-400 to-transparent opacity-80 pointer-events-none"></div>

            <div class="p-8 sm:p-10">
                <!-- Brand Header -->
                <div class="text-center mb-7">
                    <div class="text-[10px] font-black uppercase tracking-[0.2em] text-sky-400 mb-1">Sunstone Premier League 2026</div>
                    <h1 class="text-2xl sm:text-3xl font-black uppercase text-white tracking-tight" style="font-family: 'Space Grotesk', sans-serif;">
                        Franchise Owner HQ
                    </h1>
                    <p class="text-xs text-slate-400 mt-1.5 max-w-xs mx-auto">
                        Sign in or register your team franchise to participate in the live auction and manage your squad ledger.
                    </p>
                </div>

                <!-- Tab Switcher -->
                <div class="flex p-1 bg-[#050816]/80 border border-sky-950/80 rounded-xl mb-6">
                    <button type="button" id="tab-btn-login"
                        class="flex-1 py-2.5 rounded-lg text-xs font-black transition-all bg-gradient-to-r from-amber-400 to-amber-500 text-slate-950 shadow-md cursor-pointer">
                        Sign In
                    </button>
                    <button type="button" id="tab-btn-register"
                        class="flex-1 py-2.5 rounded-lg text-xs font-bold transition-all text-slate-400 hover:text-slate-200 cursor-pointer">
                        Register Franchise
                    </button>
                </div>

                <!-- Error / Success Alert Box -->
                <div id="auth-alert-box" class="hidden mb-5 p-3.5 rounded-xl text-xs font-semibold flex items-center gap-2.5">
                    <span id="auth-alert-icon" class="text-base">⚠️</span>
                    <span id="auth-alert-text">Error message here.</span>
                </div>

                <!-- ===== TAB 1: LOGIN FORM ===== -->
                <form id="owner-login-form" class="space-y-4">
                    <div>
                        <label for="login-email" class="block mb-1.5 text-[10px] font-bold uppercase tracking-widest text-slate-400">
                            Franchise Owner Email
                        </label>
                        <input type="email" id="login-email" placeholder="owner@franchise.com" autocomplete="email"
                            class="input-premium" required>
                    </div>
                    <div>
                        <label for="login-password" class="block mb-1.5 text-[10px] font-bold uppercase tracking-widest text-slate-400">
                            Password
                        </label>
                        <div class="relative">
                            <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password"
                                class="input-premium pr-10" required>
                            <button type="button" class="absolute inset-y-0 right-3 flex items-center text-slate-400 hover:text-slate-200 transition-colors"
                                onclick="const i=document.getElementById('login-password');i.type=i.type==='password'?'text':'password'">
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                            </button>
                        </div>
                    </div>
                    <button type="submit" id="login-submit-btn"
                        class="btn-gold w-full mt-2 text-sm gap-2">
                        <span>Enter Franchise Hub</span>
                        <svg id="login-spinner" class="hidden w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                        </svg>
                    </button>
                </form>

                <!-- ===== TAB 2: REGISTER FRANCHISE FORM ===== -->
                <form id="owner-register-form" class="hidden space-y-3">
                    <!-- Owner Name + Team Name Row -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                            <label for="reg-owner-name" class="block mb-1.5 text-[10px] font-bold uppercase tracking-widest text-slate-400">
                                Owner Full Name *
                            </label>
                            <input type="text" id="reg-owner-name" placeholder="Vikram Singh" maxlength="100" autocomplete="name"
                                pattern="^[A-Za-zÀ-ÿ' -]{2,100}$"
                                class="input-premium text-sm" required>
                        </div>
                        <div>
                            <label for="reg-team-name" class="block mb-1.5 text-[10px] font-bold uppercase tracking-widest text-slate-400">
                                Franchise Name *
                            </label>
                            <input type="text" id="reg-team-name" placeholder="Tech Titans"
                                class="input-premium text-sm" required>
                        </div>
                    </div>

                    <!-- Department + Team Logo -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                            <label for="reg-dept" class="block mb-1.5 text-[10px] font-bold uppercase tracking-widest text-slate-400">
                                Department *
                            </label>
                            <select id="reg-dept" class="input-premium text-sm" required>
                                <option value="" disabled selected>Select Branch</option>
                                <option value="B.Tech">B.Tech</option>
                                <option value="BCA">BCA</option>
                                <option value="BBA">BBA</option>
                                <option value="MCA">MCA</option>
                                <option value="MBA">MBA</option>
                            </select>
                        </div>
                        <div>
                            <label for="reg-logo" class="block mb-1.5 text-[10px] font-bold uppercase tracking-widest text-slate-400">
                                Team Emoji Logo *
                            </label>
                            <input type="text" id="reg-logo" placeholder="e.g. 🦅 or ⚡" maxlength="4"
                                class="input-premium text-sm text-center text-2xl" required>
                        </div>
                    </div>

                    <!-- Email + Password Row -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                            <label for="reg-email" class="block mb-1.5 text-[10px] font-bold uppercase tracking-widest text-slate-400">
                                Email *
                            </label>
                            <input type="email" id="reg-email" placeholder="owner@team.com" autocomplete="email"
                                class="input-premium text-sm" required>
                        </div>
                        <div>
                            <label for="reg-password" class="block mb-1.5 text-[10px] font-bold uppercase tracking-widest text-slate-400">
                                Password *
                            </label>
                            <input type="password" id="reg-password" placeholder="••••••••" minlength="6" autocomplete="new-password"
                                class="input-premium text-sm" required>
                        </div>
                    </div>

                    <!-- Initial Purse -->
                    <div>
                        <label for="reg-budget" class="block mb-1.5 text-[10px] font-bold uppercase tracking-widest text-slate-400">
                            Initial Franchise Purse (Points) *
                        </label>
                        <div class="relative">
                            <input type="number" id="reg-budget" placeholder="e.g. 1000" min="100" step="50"
                                class="input-premium text-sm pr-12 font-bold" required>
                            <span class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none text-slate-400 text-xs font-bold">Pts</span>
                        </div>
                    </div>

                    <button type="submit" id="register-submit-btn"
                        class="btn-gold w-full mt-2 text-sm gap-2">
                        <span>Register Franchise</span>
                        <svg id="register-spinner" class="hidden w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                        </svg>
                    </button>
                </form>

                <!-- Bottom Links -->
                <div class="mt-7 pt-6 border-t border-sky-950/80 text-center">
                    <a href="../index.html" class="text-xs text-slate-400 hover:text-sky-400 transition-colors flex items-center justify-center gap-1.5">
                        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                        Back to Tournament Public Portal
                    </a>
                </div>
            </div>
        </div>

        <!-- Bottom label -->
        <div class="text-center mt-6">
            <p class="text-[10px] text-slate-600 uppercase tracking-widest font-bold">UniBox League 2026 · Franchise Management</p>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/supabaseClient.js" onerror="this.onerror=null; this.src='../supabaseClient.js';"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tabBtnLogin = document.getElementById('tab-btn-login');
            const tabBtnRegister = document.getElementById('tab-btn-register');
            const formLogin = document.getElementById('owner-login-form');
            const formRegister = document.getElementById('owner-register-form');
            const alertBox = document.getElementById('auth-alert-box');
            const alertIcon = document.getElementById('auth-alert-icon');
            const alertText = document.getElementById('auth-alert-text');

            function showAlert(msg, isSuccess = false) {
                if (!alertBox || !alertText) return;
                alertBox.classList.remove('hidden', 'bg-rose-500/10', 'border-rose-500/20', 'text-rose-400', 'bg-emerald-500/10', 'border-emerald-500/20', 'text-emerald-400');
                if (isSuccess) {
                    alertBox.classList.add('bg-emerald-500/10', 'border-emerald-500/20', 'text-emerald-400');
                    if (alertIcon) alertIcon.textContent = '✓';
                } else {
                    alertBox.classList.add('bg-rose-500/10', 'border-rose-500/20', 'text-rose-400');
                    if (alertIcon) alertIcon.textContent = '⚠️';
                }
                alertText.textContent = msg;
            }

            function hideAlert() {
                if (alertBox) alertBox.classList.add('hidden');
            }

            // Tab Switchers (Midnight Gold Accent)
            tabBtnLogin?.addEventListener('click', () => {
                tabBtnLogin.className = 'flex-1 py-2.5 rounded-lg text-xs font-black transition-all bg-gradient-to-r from-amber-400 to-amber-500 text-slate-950 shadow-md cursor-pointer';
                tabBtnRegister.className = 'flex-1 py-2.5 rounded-lg text-xs font-bold transition-all text-slate-400 hover:text-slate-200 cursor-pointer';
                formLogin?.classList.remove('hidden');
                formRegister?.classList.add('hidden');
                hideAlert();
            });

            tabBtnRegister?.addEventListener('click', () => {
                tabBtnRegister.className = 'flex-1 py-2.5 rounded-lg text-xs font-black transition-all bg-gradient-to-r from-amber-400 to-amber-500 text-slate-950 shadow-md cursor-pointer';
                tabBtnLogin.className = 'flex-1 py-2.5 rounded-lg text-xs font-bold transition-all text-slate-400 hover:text-slate-200 cursor-pointer';
                formRegister?.classList.remove('hidden');
                formLogin?.classList.add('hidden');
                hideAlert();
            });

            // Owner Full Name Strict Input Sanitization
            const regOwnerNameInput = document.getElementById('reg-owner-name');
            if (regOwnerNameInput) {
                regOwnerNameInput.addEventListener('beforeinput', (e) => {
                    if (e.data && /[^A-Za-zÀ-ÿ' -]/.test(e.data)) {
                        e.preventDefault();
                    }
                });
                regOwnerNameInput.addEventListener('keydown', (e) => {
                    if (e.ctrlKey || e.altKey || e.metaKey || e.key.length > 1) return;
                    if (!/^[A-Za-zÀ-ÿ' -]$/.test(e.key)) {
                        e.preventDefault();
                    }
                });
                regOwnerNameInput.addEventListener('input', () => {
                    regOwnerNameInput.value = regOwnerNameInput.value
                        .replace(/[^A-Za-zÀ-ÿ' -]/g, '')
                        .replace(/\s{2,}/g, ' ');
                });
                regOwnerNameInput.addEventListener('blur', () => {
                    regOwnerNameInput.value = regOwnerNameInput.value.trim().replace(/\s{2,}/g, ' ');
                });
            }

            // Login Form Submission
            formLogin?.addEventListener('submit', async (e) => {
                e.preventDefault();
                hideAlert();

                const email = document.getElementById('login-email')?.value?.trim();
                const password = document.getElementById('login-password')?.value;
                const spinner = document.getElementById('login-spinner');
                const btn = document.getElementById('login-submit-btn');

                if (!email || !password) {
                    showAlert('Please enter both email and password.');
                    return;
                }

                if (spinner) spinner.classList.remove('hidden');
                if (btn) btn.disabled = true;

                try {
                    if (window.UniBoxDb) {
                        const res = await window.UniBoxDb.loginTeamOwner(email, password);
                        if (!res.success) {
                            showAlert(res.error || 'Authentication failed. Please verify credentials.');
                            return;
                        }

                        showAlert(`Authenticated as ${res.team.name} Owner! Redirecting...`, true);
                        setTimeout(() => {
                            window.location.replace('index.html');
                        }, 500);
                    } else {
                        showAlert('Database service is not ready. Please refresh the page.');
                    }
                } catch (err) {
                    console.error('Owner login error:', err);
                    showAlert(err.message || 'Login failed. Please try again.');
                } finally {
                    if (spinner) spinner.classList.add('hidden');
                    if (btn) btn.disabled = false;
                }
            });

            // Registration Form Submission
            formRegister?.addEventListener('submit', async (e) => {
                e.preventDefault();
                hideAlert();

                const ownerName = document.getElementById('reg-owner-name')?.value?.trim();
                const customTeamName = document.getElementById('reg-team-name')?.value?.trim();
                const department = document.getElementById('reg-dept')?.value;
                const logo = document.getElementById('reg-logo')?.value?.trim() || '🏏';
                const email = document.getElementById('reg-email')?.value?.trim();
                const password = document.getElementById('reg-password')?.value;
                const budget = Number(document.getElementById('reg-budget')?.value) || 1000;
                const spinner = document.getElementById('register-spinner');
                const btn = document.getElementById('register-submit-btn');

                if (!ownerName || !customTeamName || !department || !email || !password) {
                    showAlert('Please complete all required fields.');
                    return;
                }

                if (/[0-9]/.test(ownerName)) {
                    showAlert('Owner Full Name cannot contain numbers.');
                    return;
                }

                if (/[^A-Za-zÀ-ÿ' -]/.test(ownerName)) {
                    showAlert('Owner Full Name can only contain letters, spaces, hyphens and apostrophes.');
                    return;
                }

                if (ownerName.length < 2) {
                    showAlert('Owner Full Name must be at least 2 characters long.');
                    return;
                }

                if (spinner) spinner.classList.remove('hidden');
                if (btn) btn.disabled = true;

                try {
                    if (window.UniBoxDb) {
                        const res = await window.UniBoxDb.registerTeamOwner({
                            ownerName,
                            email,
                            password,
                            teamMode: 'custom',
                            customTeamName,
                            department,
                            logo,
                            budget,
                            color: '#F5C542'
                        });

                        if (!res.success) {
                            showAlert(res.error || 'Registration failed.');
                            return;
                        }

                        showAlert(`Franchise "${res.team.name}" registered successfully! Redirecting to hub...`, true);
                        setTimeout(() => {
                            window.location.replace('index.html');
                        }, 600);
                    } else {
                        showAlert('Database service is not ready. Please refresh the page.');
                    }
                } catch (err) {
                    console.error('Owner registration error:', err);
                    showAlert(err.message || 'Registration failed. Check network or server connection.');
                } finally {
                    if (spinner) spinner.classList.add('hidden');
                    if (btn) btn.disabled = false;
                }
            });
        });
    </script>
</body>

</html>
